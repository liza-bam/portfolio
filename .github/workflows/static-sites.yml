name: Publish sandy.tayts.com

# Push to main -> assume this site's deploy role via OIDC (no stored keys) -> mirror site/
# to the site's prefix in the static-sites bucket -> invalidate this site's tenant.
# Runs beside pages.yml (GitHub Pages); the two don't interact.
#
# The role is defined in 104ru/static-sites (infra/github.tf) and can write ONLY
# s3://<bucket>/sandy/ and invalidate ONLY this site's tenant.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: static-sites-publish
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  # Not secrets: `terraform -chdir=infra output sites` / `output bucket` in static-sites.
  AWS_REGION: us-west-2
  DEPLOY_ROLE_ARN: arn:aws:iam::583057901773:role/static-sites-sandy-deploy
  BUCKET: static-sites-583057901773
  SITE: sandy
  TENANT_ID: dt_3MHxvwmOLfnlBzDSIJfucmDaRdt

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Only site/ is published, so only site/ is checked out (the archive is most of the repo).
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            /scripts/build-markdown.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Markdown copies of the sitemap pages, for agents (page.html -> page.md).
      - name: Build Markdown copies
        run: |
          set -euo pipefail
          pip install --quiet markdownify beautifulsoup4
          python3 scripts/build-markdown.py site > markdown-files.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --delete removes from the site whatever was removed from site/.
      # Dotfiles and Markdown notes (README.md, STYLE-GUIDE.md) stay out.
      - name: Sync site/ to S3
        run: |
          set -euo pipefail
          aws s3 sync site/ "s3://$BUCKET/$SITE/" --delete \
            --exclude '.*' --exclude '*/.*' --exclude '*.md'

      - name: Upload Markdown copies
        run: |
          set -euo pipefail
          while read -r f; do
            aws s3 cp "$f" "s3://$BUCKET/$SITE/${f#site/}" --content-type "text/markdown; charset=utf-8"
          done < markdown-files.txt

      # Agent discovery files. The sync above skips them (.well-known/ is a dot-folder, and
      # *.md is excluded), and several need an exact Content-Type the scanners check:
      # api-catalog has no extension and must be application/linkset+json.
      # Like the Markdown copies, a file removed from site/ is NOT removed from S3 here.
      - name: Upload agent discovery files
        run: |
          set -euo pipefail
          skill=site/.well-known/agent-skills/sandy-portfolio/SKILL.md
          want=$(jq -r '.skills[0].digest' site/.well-known/agent-skills/index.json)
          have="sha256:$(sha256sum "$skill" | cut -d' ' -f1)"
          [ "$want" = "$have" ] || { echo "::error::agent-skills/index.json digest is $want, SKILL.md is $have — update the index"; exit 1; }
          dest="s3://$BUCKET/$SITE"
          md='text/markdown; charset=utf-8'
          aws s3 cp site/.well-known/ "$dest/.well-known/" --recursive \
            --exclude '*' --include '*.json' --content-type 'application/json'
          aws s3 cp site/.well-known/api-catalog "$dest/.well-known/api-catalog" --content-type 'application/linkset+json'
          aws s3 cp "$skill" "$dest/${skill#site/}" --content-type "$md"
          aws s3 cp site/auth.md "$dest/auth.md" --content-type "$md"

      - name: Invalidate this site's tenant
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation-for-distribution-tenant \
            --id "$TENANT_ID" \
            --invalidation-batch "Paths={Quantity=1,Items=[/*]},CallerReference=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --query Invalidation.Id --output text)
          echo "Invalidation: $id"
